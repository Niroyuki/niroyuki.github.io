<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たのしい！てんびん はかる・くらべる実験室</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Friendly Japanese Typography -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .pan-transition {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .beam-transition {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .pulse-gentle {
            animation: pulseGentle 2s infinite;
        }
        @keyframes pulseGentle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .drop-zone-active {
            outline: 3px dashed #3b82f6;
            outline-offset: 4px;
            background-color: rgba(219, 234, 254, 0.5);
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-amber-400 border-b-4 border-amber-500 p-4 shadow-md sticky top-0 z-30">
        <div class="max-w-5xl mx-auto flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center gap-3">
                <div class="bg-white p-2 rounded-2xl shadow-inner text-amber-600">
                    <i data-lucide="scale" class="w-8 h-8"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-amber-950 tracking-wide">てんびん はかる・くらべる実験室</h1>
                    <p class="text-xs sm:text-sm font-bold text-amber-800">おもりと モノを のせて つりあわせよう！</p>
                </div>
            </div>
            
            <!-- Mode Selector & Sound Toggle -->
            <div class="flex items-center gap-2">
                <button id="soundToggleBtn" onclick="toggleSound()" class="bg-white/80 hover:bg-white text-amber-900 font-bold px-3 py-2 rounded-xl shadow-sm border-2 border-amber-300 text-sm flex items-center gap-1.5 transition">
                    <i id="soundIcon" data-lucide="volume-2" class="w-4 h-4 text-emerald-600"></i>
                    <span id="soundLabel">おと: ON</span>
                </button>
                <div class="bg-amber-200/80 p-1 rounded-xl flex gap-1 border border-amber-300">
                    <button id="modeFreeBtn" onclick="switchMode('free')" class="px-3 py-1.5 rounded-lg font-bold text-sm bg-white text-amber-900 shadow">じゆう実験</button>
                    <button id="modeQuizBtn" onclick="switchMode('quiz')" class="px-3 py-1.5 rounded-lg font-bold text-sm text-amber-800 hover:bg-white/50">重さあてクイズ</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-5xl mx-auto w-full px-4 py-4 flex-1 flex flex-col gap-4">

        <!-- Banner / Quiz Instruction -->
        <div id="instructionBox" class="bg-white border-2 border-amber-300 rounded-2xl p-3 shadow-sm flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 text-amber-900 font-bold text-sm sm:text-base">
                <span class="bg-amber-100 text-amber-700 px-2.5 py-1 rounded-lg text-xs font-black">ひんと</span>
                <span id="instructionText">調べたいものを 皿にのせて、おもりで つりあわせよう！</span>
            </div>
            <button id="toggleAnswerBtn" onclick="toggleAnswerHint()" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1 transition">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                <span id="answerBtnText">計算を表示</span>
            </button>
        </div>

        <!-- Scale Visual Playground -->
        <div class="bg-gradient-to-b from-sky-100 to-sky-200 border-4 border-sky-300 rounded-3xl p-4 shadow-lg relative min-h-[380px] flex flex-col justify-between overflow-hidden">
            
            <!-- Balanced Status Badge -->
            <div id="balanceBadge" class="absolute top-4 left-1/2 -translate-x-1/2 z-20 transition-all transform scale-0 duration-300">
                <div class="bg-emerald-500 text-white font-black px-6 py-2 rounded-full shadow-lg border-2 border-white text-lg flex items-center gap-2 pulse-gentle">
                    <i data-lucide="sparkles" class="w-6 h-6"></i>
                    <span>ピッタリ つりあった！</span>
                </div>
            </div>

            <!-- SVG Scale Container -->
            <div class="w-full relative flex-1 flex items-center justify-center">
                <svg id="scaleSvg" viewBox="0 0 800 360" class="w-full h-auto max-h-[360px] drop-shadow-md">
                    
                    <!-- Background Markings / Horizon -->
                    <line x1="50" y1="320" x2="750" y2="320" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8 8" />
                    
                    <!-- Base Stand -->
                    <polygon points="400,190 350,330 450,330" fill="#64748b" stroke="#334155" stroke-width="4" stroke-linejoin="round" />
                    <rect x="330" y="325" width="140" height="15" rx="5" fill="#475569" stroke="#1e293b" stroke-width="3"/>
                    <circle cx="400" cy="190" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>

                    <!-- Rotating Beam Group -->
                    <g id="scaleBeamGroup" class="beam-transition" style="transform-origin: 400px 190px; transform: rotate(0deg);">
                        <!-- Main Beam Stick -->
                        <rect x="120" y="182" width="560" height="16" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="4"/>
                        <!-- Center Pointer -->
                        <polygon points="400,190 395,130 405,130" fill="#ef4444" />

                        <!-- Left Pan Assembly -->
                        <g transform="translate(180, 190)">
                            <!-- Counter-rotating group to keep pan horizontal -->
                            <g id="leftPanGroup" class="pan-transition" style="transform-origin: 0px 0px; transform: rotate(0deg);">
                                <!-- Strings -->
                                <line x1="0" y1="0" x2="-70" y2="90" stroke="#94a3b8" stroke-width="3"/>
                                <line x1="0" y1="0" x2="70" y2="90" stroke="#94a3b8" stroke-width="3"/>
                                <!-- Pan Plate -->
                                <path d="M -90 90 Q 0 115 90 90 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="4"/>
                                <rect x="-85" y="86" width="170" height="6" rx="3" fill="#bae6fd" />
                                
                                <!-- Left Pan Drop Target Label -->
                                <text x="0" y="108" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">ひだりのおざら</text>

                                <!-- Left Items Slot (HTML Overlay via ForeignObject) -->
                                <foreignObject x="-100" y="-10" width="200" height="100">
                                    <div id="leftPanContainer" 
                                         class="w-full h-full flex items-end justify-center gap-1 p-1"
                                         ondragover="allowDrop(event)" 
                                         ondrop="handleDrop(event, 'left')"
                                         onclick="handlePanClick('left')">
                                        <!-- Dynamic Left Items -->
                                    </div>
                                </foreignObject>
                            </g>
                        </g>

                        <!-- Right Pan Assembly -->
                        <g transform="translate(620, 190)">
                            <!-- Counter-rotating group -->
                            <g id="rightPanGroup" class="pan-transition" style="transform-origin: 0px 0px; transform: rotate(0deg);">
                                <!-- Strings -->
                                <line x1="0" y1="0" x2="-70" y2="90" stroke="#94a3b8" stroke-width="3"/>
                                <line x1="0" y1="0" x2="70" y2="90" stroke="#94a3b8" stroke-width="3"/>
                                <!-- Pan Plate -->
                                <path d="M -90 90 Q 0 115 90 90 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="4"/>
                                <rect x="-85" y="86" width="170" height="6" rx="3" fill="#bae6fd" />
                                
                                <!-- Right Pan Drop Target Label -->
                                <text x="0" y="108" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">みぎのおざら</text>

                                <!-- Right Items Slot -->
                                <foreignObject x="-100" y="-10" width="200" height="100">
                                    <div id="rightPanContainer" 
                                         class="w-full h-full flex items-end justify-center gap-1 p-1"
                                         ondragover="allowDrop(event)" 
                                         ondrop="handleDrop(event, 'right')"
                                         onclick="handlePanClick('right')">
                                        <!-- Dynamic Right Items -->
                                    </div>
                                </foreignObject>
                            </g>
                        </g>
                    </g>
                </svg>
            </div>

            <!-- Weight Formula / Calculation Drawer (Hidden by default) -->
            <div id="calculationDrawer" style="display: none;" class="bg-white/90 backdrop-blur-sm rounded-2xl p-3 border-2 border-sky-300 flex justify-around items-center text-center shadow-md">
                <div class="flex-1">
                    <div class="text-xs font-bold text-sky-700">ひだりの重さ</div>
                    <div id="leftWeightVal" class="text-xl font-black text-sky-900">0 g</div>
                </div>
                <div class="text-xl font-black text-amber-500 px-2" id="comparisonSymbol">＝</div>
                <div class="flex-1">
                    <div class="text-xs font-bold text-sky-700">みぎの重さ</div>
                    <div id="rightWeightVal" class="text-xl font-black text-sky-900">0 g</div>
                </div>
            </div>
        </div>

        <!-- Items & Weights Tray Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- Left Panel: "調べたいもの" (Target Objects) -->
            <div class="bg-white border-2 border-orange-200 rounded-3xl p-4 shadow-sm flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="font-extrabold text-orange-950 flex items-center gap-2">
                            <span class="bg-orange-500 text-white rounded-lg p-1 text-xs">1</span>
                            調べたいもの（しらべたいもの）
                        </h2>
                    </div>

                    <!-- Target Item Selection Tabs -->
                    <div class="grid grid-cols-4 gap-1.5 mb-3">
                        <button onclick="selectPreset('apple')" id="btn-apple" class="preset-btn p-2 rounded-xl border-2 border-orange-500 bg-orange-200 ring-2 ring-orange-400 font-bold text-xs flex flex-col items-center gap-1 transition">
                            <span class="text-2xl">🍎</span>
                            <span>りんご</span>
                        </button>
                        <button onclick="selectPreset('bottle')" id="btn-bottle" class="preset-btn p-2 rounded-xl border-2 border-orange-200 bg-orange-50 hover:bg-orange-100 font-bold text-xs flex flex-col items-center gap-1 transition">
                            <span class="text-2xl">🧃</span>
                            <span>水とう</span>
                        </button>
                        <button onclick="selectPreset('book')" id="btn-book" class="preset-btn p-2 rounded-xl border-2 border-orange-200 bg-orange-50 hover:bg-orange-100 font-bold text-xs flex flex-col items-center gap-1 transition">
                            <span class="text-2xl">📚</span>
                            <span>教科書</span>
                        </button>
                        <button onclick="selectPreset('custom')" id="btn-custom" class="preset-btn p-2 rounded-xl border-2 border-orange-200 bg-orange-50 hover:bg-orange-100 font-bold text-xs flex flex-col items-center gap-1 transition">
                            <span class="text-2xl">🎁</span>
                            <span>じぶんで</span>
                        </button>
                    </div>

                    <!-- Custom Weight Input Box (Only active for 'custom') -->
                    <div id="customWeightBox" class="hidden bg-orange-50 p-3 rounded-2xl border border-orange-200 mb-3">
                        <label class="block text-xs font-bold text-orange-900 mb-1">お好みの重さを設定（10g 〜 1300g）:</label>
                        <div class="flex items-center gap-2">
                            <input type="range" id="customRange" min="50" max="1300" step="10" value="500" class="w-full accent-orange-500" oninput="updateCustomWeight(this.value)">
                            <span id="customWeightDisplay" class="font-extrabold text-orange-900 min-w-[60px] text-right">500g</span>
                        </div>
                    </div>
                </div>

                <!-- Target Item Shelf Area -->
                <div class="bg-orange-50/60 rounded-2xl border-2 border-dashed border-orange-300 p-3 min-h-[90px] flex items-center justify-center"
                     ondragover="allowDrop(event)" 
                     ondrop="handleDrop(event, 'shelf')">
                    <div id="targetItemContainer" class="flex items-center justify-center w-full">
                        <!-- Rendered Target Item -->
                    </div>
                </div>
            </div>

            <!-- Right Panel: "おもり" (Weights 900g, 300g, 100g + 追加おもり) -->
            <div class="bg-white border-2 border-indigo-200 rounded-3xl p-4 shadow-sm flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <h2 class="font-extrabold text-indigo-950 flex items-center gap-2">
                            <span class="bg-indigo-600 text-white rounded-lg p-1 text-xs">2</span>
                            つかう おもり
                        </h2>
                        <span class="text-xs font-bold text-indigo-500">1つずつ つかえます</span>
                    </div>
                    <p class="text-xs text-indigo-800 font-medium mb-2">
                        おもりをお皿にのせたり、おろしたりして つりあわせよう！
                    </p>

                    <!-- 追加おもり (Custom Weight) Setting -->
                    <div class="bg-amber-50/80 p-2.5 rounded-2xl border border-amber-200 mb-3">
                        <div class="flex justify-between items-center mb-1">
                            <label for="extraWeightRange" class="text-xs font-bold text-amber-950 flex items-center gap-1">
                                <span class="bg-amber-500 text-white text-[10px] px-1.5 py-0.5 rounded-md font-extrabold">＋ついか</span>
                                自由なおもりの重さ（10g〜1000g）:
                            </label>
                            <span id="extraWeightDisplay" class="font-extrabold text-amber-900 text-xs bg-white px-2 py-0.5 rounded-lg border border-amber-300">50g</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="range" id="extraWeightRange" min="10" max="1000" step="10" value="50" class="w-full accent-amber-500" oninput="updateExtraWeight(this.value)">
                        </div>
                    </div>
                </div>

                <!-- Weights Shelf Area -->
                <div class="bg-indigo-50/60 rounded-2xl border-2 border-dashed border-indigo-300 p-3 min-h-[90px] flex items-center justify-around gap-2"
                     ondragover="allowDrop(event)" 
                     ondrop="handleDrop(event, 'shelf')">
                    <div id="weightsShelfContainer" class="flex items-center justify-around w-full gap-2">
                        <!-- Rendered Weights (900g, 300g, 100g, 追加おもり) -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Quiz Control & Reset Footer Bar -->
        <div class="flex flex-wrap items-center justify-between gap-3 bg-white rounded-2xl p-3 border border-slate-200 shadow-sm">
            <button onclick="resetAllPositions()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm flex items-center gap-2 transition">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                <span>おもり・モノをもとに戻す</span>
            </button>

            <!-- Quiz Answer Area (Quiz Mode Only) -->
            <div id="quizAnswerArea" class="hidden flex items-center gap-2 bg-purple-50 p-1.5 rounded-xl border border-purple-200">
                <span class="text-xs font-bold text-purple-900 pl-2">重さは何gかな？:</span>
                <input type="number" id="quizInput" placeholder="??? g" class="w-24 px-2 py-1 border-2 border-purple-300 rounded-lg font-bold text-center text-sm focus:outline-none focus:border-purple-600">
                <button onclick="checkQuizAnswer()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-3 py-1.5 rounded-lg text-sm transition">
                    こたえあわせ
                </button>
            </div>
        </div>
    </main>

    <!-- Custom Modal Dialog (Replacing alert) -->
    <div id="messageModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border-4 border-amber-300 text-center transform transition-all scale-95 opacity-0" id="modalCard">
            <div id="modalIcon" class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl">
                ✨
            </div>
            <h3 id="modalTitle" class="text-xl font-black text-slate-800 mb-2">タイトル</h3>
            <p id="modalBody" class="text-sm font-bold text-slate-600 mb-5 leading-relaxed">メッセージ文</p>
            <button onclick="closeModal()" class="w-full bg-amber-400 hover:bg-amber-500 text-amber-950 font-black py-3 rounded-2xl shadow-md transition text-base">
                わかった！
            </button>
        </div>
    </div>

    <script>
        // Sound state
        let soundEnabled = true;
        let synth = null;

        // Current App Mode: 'free' or 'quiz'
        let currentMode = 'free';
        let showCalculation = false;

        // Weights Data Definition (900g, 300g, 100g, + ついかのおもり)
        const weightsData = {
            'w900': { id: 'w900', weight: 900, name: '900gのおもり', label: '900g', color: 'bg-purple-600', border: 'border-purple-800', size: 'w-16 h-16', location: 'shelf' },
            'w300': { id: 'w300', weight: 300, name: '300gのおもり', label: '300g', color: 'bg-blue-600', border: 'border-blue-800', size: 'w-14 h-14', location: 'shelf' },
            'w100': { id: 'w100', weight: 100, name: '100gのおもり', label: '100g', color: 'bg-emerald-600', border: 'border-emerald-800', size: 'w-12 h-12', location: 'shelf' },
            'wCustom': { id: 'wCustom', weight: 50, name: 'ついかのおもり', label: '50g', color: 'bg-amber-600', border: 'border-amber-800', size: 'w-12 h-12', location: 'shelf' }
        };

        // Presets for "調べたいもの"
        const presets = {
            'apple': { id: 'target', name: 'あかいりんご', weight: 400, icon: '🍎', type: 'preset', location: 'shelf' },
            'bottle': { id: 'target', name: '水とう', weight: 1000, icon: '🧃', type: 'preset', location: 'shelf' },
            'book': { id: 'target', name: '教科書', weight: 200, icon: '📚', type: 'preset', location: 'shelf' },
            'custom': { id: 'target', name: 'じぶんで決めたもの', weight: 500, icon: '🎁', type: 'custom', location: 'shelf' }
        };

        let currentPresetKey = 'apple';
        let targetObject = { ...presets['apple'] };

        // Dragged item state tracker
        let draggedItemId = null;

        function initAudio() {
            if (!synth && typeof Tone !== 'undefined') {
                try {
                    synth = new Tone.PolySynth(Tone.Synth).toDestination();
                    synth.volume.value = -12;
                } catch (e) {
                    console.log("Audio init error", e);
                }
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!synth) return;

            try {
                const now = Tone.now();
                if (type === 'place') {
                    synth.triggerAttackRelease("C4", "8n", now);
                } else if (type === 'remove') {
                    synth.triggerAttackRelease("G3", "8n", now);
                } else if (type === 'balance') {
                    synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "4n", now);
                } else if (type === 'correct') {
                    synth.triggerAttackRelease(["E5", "A5"], "8n", now);
                } else if (type === 'wrong') {
                    synth.triggerAttackRelease(["C3", "C3"], "8n", now);
                }
            } catch (e) {
                // Ignore audio errors gracefully
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            const label = document.getElementById('soundLabel');
            if (soundEnabled) {
                label.innerText = 'おと: ON';
                icon.setAttribute('data-lucide', 'volume-2');
                icon.className = 'w-4 h-4 text-emerald-600';
            } else {
                label.innerText = 'おと: OFF';
                icon.setAttribute('data-lucide', 'volume-x');
                icon.className = 'w-4 h-4 text-slate-400';
            }
            lucide.createIcons();
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderAll();
        });

        // Select preset item
        function selectPreset(key) {
            currentPresetKey = key;
            targetObject = { ...presets[key] };
            targetObject.location = 'shelf'; // Reset position

            if (key === 'custom') {
                document.getElementById('customWeightBox').classList.remove('hidden');
                targetObject.weight = parseInt(document.getElementById('customRange').value, 10);
            } else {
                document.getElementById('customWeightBox').classList.add('hidden');
            }

            // Highlight Active Preset Tab
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('border-orange-500', 'bg-orange-200', 'ring-2', 'ring-orange-400');
                btn.classList.add('border-orange-200', 'bg-orange-50');
            });
            const activeBtn = document.getElementById(`btn-${key}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-orange-200', 'bg-orange-50');
                activeBtn.classList.add('border-orange-500', 'bg-orange-200', 'ring-2', 'ring-orange-400');
            }

            if (currentMode === 'quiz') {
                setupQuizTarget();
            }

            playSound('place');
            renderAll();
        }

        function updateCustomWeight(val) {
            document.getElementById('customWeightDisplay').innerText = val + 'g';
            if (currentPresetKey === 'custom') {
                targetObject.weight = parseInt(val, 10);
                updateScalePhysics();
            }
        }

        function updateExtraWeight(val) {
            const weightVal = parseInt(val, 10);
            weightsData.wCustom.weight = weightVal;
            weightsData.wCustom.label = `${weightVal}g`;
            weightsData.wCustom.name = `ついか(${weightVal}g)`;
            document.getElementById('extraWeightDisplay').innerText = `${weightVal}g`;
            
            renderWeights();
            renderPanContents();
            updateScalePhysics();
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function handleDragStart(ev, itemId) {
            draggedItemId = itemId;
            ev.dataTransfer.setData("text/plain", itemId);
        }

        function handleDrop(ev, targetLocation) {
            ev.preventDefault();
            const id = draggedItemId || ev.dataTransfer.getData("text/plain");
            if (!id) return;

            moveItemToLocation(id, targetLocation);
            draggedItemId = null;
        }

        function moveItemToLocation(id, location) {
            if (id === 'target') {
                if (targetObject.location !== location) {
                    targetObject.location = location;
                    playSound(location === 'shelf' ? 'remove' : 'place');
                }
            } else if (weightsData[id]) {
                if (weightsData[id].location !== location) {
                    weightsData[id].location = location;
                    playSound(location === 'shelf' ? 'remove' : 'place');
                }
            }
            renderAll();
        }

        function handleItemClick(id) {
            let item = id === 'target' ? targetObject : weightsData[id];
            if (!item) return;

            // Cycle location: shelf -> left -> right -> shelf
            if (item.location === 'shelf') {
                moveItemToLocation(id, 'left');
            } else if (item.location === 'left') {
                moveItemToLocation(id, 'right');
            } else {
                moveItemToLocation(id, 'shelf');
            }
        }

        function handlePanClick(panSide) {
            if (targetObject.location === 'shelf') {
                moveItemToLocation('target', panSide);
            }
        }

        function resetAllPositions() {
            targetObject.location = 'shelf';
            Object.keys(weightsData).forEach(k => {
                weightsData[k].location = 'shelf';
            });
            playSound('remove');
            renderAll();
        }

        function renderAll() {
            renderTargetItem();
            renderWeights();
            renderPanContents();
            updateScalePhysics();
        }

        function renderTargetItem() {
            const container = document.getElementById('targetItemContainer');
            if (!container) return;
            container.innerHTML = '';

            if (targetObject.location === 'shelf') {
                const el = createItemElement(targetObject, 'target');
                container.appendChild(el);
            } else {
                container.innerHTML = `<span class="text-xs text-orange-400 font-bold">天秤の上にのっています</span>`;
            }
        }

        function renderWeights() {
            const container = document.getElementById('weightsShelfContainer');
            if (!container) return;
            container.innerHTML = '';

            Object.keys(weightsData).forEach(key => {
                const w = weightsData[key];
                if (w.location === 'shelf') {
                    const el = createWeightElement(w);
                    container.appendChild(el);
                }
            });
            
            if (container.children.length === 0) {
                container.innerHTML = `<span class="text-xs text-indigo-400 font-bold">全てのおもりが天秤にのっています</span>`;
            }
        }

        function createWeightElement(w) {
            const div = document.createElement('div');
            div.className = `${w.color} text-white font-extrabold rounded-full ${w.size} flex flex-col items-center justify-center shadow-md cursor-grab active:cursor-grabbing hover:scale-105 border-2 ${w.border} transition transform`;
            div.draggable = true;
            div.id = `elem-${w.id}`;
            div.ondragstart = (e) => handleDragStart(e, w.id);
            div.onclick = () => handleItemClick(w.id);

            div.innerHTML = `
                <span class="text-[10px] leading-tight opacity-80">おもり</span>
                <span class="text-xs sm:text-sm font-black">${w.label}</span>
            `;
            return div;
        }

        function createItemElement(obj, id) {
            const div = document.createElement('div');
            div.className = `bg-amber-100 border-2 border-amber-400 rounded-2xl p-2 flex flex-col items-center justify-center shadow-sm cursor-grab active:cursor-grabbing hover:scale-105 transition transform min-w-[100px]`;
            div.draggable = true;
            div.id = `elem-${id}`;
            div.ondragstart = (e) => handleDragStart(e, id);
            div.onclick = () => handleItemClick(id);

            const displayWeight = (currentMode === 'quiz' && obj.isQuizSecret) ? '??? g' : `${obj.weight}g`;

            div.innerHTML = `
                <span class="text-3xl mb-1">${obj.icon}</span>
                <span class="text-xs font-black text-amber-950">${obj.name}</span>
                <span class="text-[11px] font-bold text-amber-700 bg-amber-200/80 px-2 py-0.5 rounded-full mt-1">${displayWeight}</span>
            `;
            return div;
        }

        function renderPanContents() {
            const leftPan = document.getElementById('leftPanContainer');
            const rightPan = document.getElementById('rightPanContainer');
            if (!leftPan || !rightPan) return;
            leftPan.innerHTML = '';
            rightPan.innerHTML = '';

            // Check target object
            if (targetObject.location === 'left') {
                leftPan.appendChild(createItemElement(targetObject, 'target'));
            } else if (targetObject.location === 'right') {
                rightPan.appendChild(createItemElement(targetObject, 'target'));
            }

            // Check weights
            Object.keys(weightsData).forEach(k => {
                const w = weightsData[k];
                if (w.location === 'left') {
                    leftPan.appendChild(createWeightElement(w));
                } else if (w.location === 'right') {
                    rightPan.appendChild(createWeightElement(w));
                }
            });
        }

        function updateScalePhysics() {
            // Calculate total weight on Left and Right
            let leftTotal = 0;
            let rightTotal = 0;

            if (targetObject.location === 'left') leftTotal += targetObject.weight;
            if (targetObject.location === 'right') rightTotal += targetObject.weight;

            Object.keys(weightsData).forEach(k => {
                const w = weightsData[k];
                if (w.location === 'left') leftTotal += w.weight;
                if (w.location === 'right') rightTotal += w.weight;
            });

            // Update numeric displays
            document.getElementById('leftWeightVal').innerText = leftTotal + ' g';
            document.getElementById('rightWeightVal').innerText = rightTotal + ' g';

            const diff = rightTotal - leftTotal;
            
            // Calculate tilt angle (-18 to +18 degrees)
            let angle = 0;
            if (diff !== 0) {
                angle = Math.max(-18, Math.min(18, diff * 0.05));
                if (Math.abs(angle) < 3) {
                    angle = diff > 0 ? 3 : -3;
                }
            }

            // Apply SVG transforms
            const beamGroup = document.getElementById('scaleBeamGroup');
            const leftPanGroup = document.getElementById('leftPanGroup');
            const rightPanGroup = document.getElementById('rightPanGroup');

            if (beamGroup) beamGroup.style.transform = `rotate(${angle}deg)`;
            if (leftPanGroup) leftPanGroup.style.transform = `rotate(${-angle}deg)`;
            if (rightPanGroup) rightPanGroup.style.transform = `rotate(${-angle}deg)`;

            // Update Comparison symbol
            const sym = document.getElementById('comparisonSymbol');
            if (sym) {
                if (leftTotal === rightTotal) {
                    sym.innerText = '＝';
                    sym.className = 'text-xl font-black text-emerald-500 px-2';
                } else if (leftTotal > rightTotal) {
                    sym.innerText = '＞';
                    sym.className = 'text-xl font-black text-amber-500 px-2';
                } else {
                    sym.innerText = '＜';
                    sym.className = 'text-xl font-black text-amber-500 px-2';
                }
            }

            // Balanced Badge trigger
            const badge = document.getElementById('balanceBadge');
            const hasItemsOnScale = (leftTotal > 0 || rightTotal > 0);

            if (badge) {
                if (hasItemsOnScale && leftTotal === rightTotal) {
                    if (!badge.classList.contains('scale-100')) {
                        badge.classList.remove('scale-0');
                        badge.classList.add('scale-100');
                        playSound('balance');
                    }
                } else {
                    badge.classList.remove('scale-100');
                    badge.classList.add('scale-0');
                }
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            const freeBtn = document.getElementById('modeFreeBtn');
            const quizBtn = document.getElementById('modeQuizBtn');
            const quizArea = document.getElementById('quizAnswerArea');

            if (mode === 'free') {
                freeBtn.className = 'px-3 py-1.5 rounded-lg font-bold text-sm bg-white text-amber-900 shadow';
                quizBtn.className = 'px-3 py-1.5 rounded-lg font-bold text-sm text-amber-800 hover:bg-white/50';
                quizArea.classList.add('hidden');
                document.getElementById('instructionText').innerText = '調べたいものを 皿にのせて、おもりで つりあわせよう！';
                targetObject.isQuizSecret = false;
            } else {
                quizBtn.className = 'px-3 py-1.5 rounded-lg font-bold text-sm bg-white text-amber-900 shadow';
                freeBtn.className = 'px-3 py-1.5 rounded-lg font-bold text-sm text-amber-800 hover:bg-white/50';
                quizArea.classList.remove('hidden');
                document.getElementById('instructionText').innerText = '「????g」のなぞの箱の重さを 天秤をつかって 当てよう！';
                setupQuizTarget();
            }

            resetAllPositions();
        }

        function setupQuizTarget() {
            const quizWeights = [100, 300, 400, 700, 800, 900, 1000, 1200, 1300];
            const randomWeight = quizWeights[Math.floor(Math.random() * quizWeights.length)];

            targetObject = {
                id: 'target',
                name: 'なぞのたからばこ',
                weight: randomWeight,
                icon: '🎁',
                type: 'quiz',
                location: 'shelf',
                isQuizSecret: true
            };
            document.getElementById('quizInput').value = '';
            renderAll();
        }

        function checkQuizAnswer() {
            const val = parseInt(document.getElementById('quizInput').value, 10);
            if (isNaN(val)) {
                showModal('入力エラー', '何グラムか 数字を入力してね！', '❓');
                return;
            }

            if (val === targetObject.weight) {
                playSound('correct');
                showModal('大正解！🎉', `せいかい！ なぞの箱の重さは ${targetObject.weight}g でした！`, '✨');
            } else {
                playSound('wrong');
                showModal('おしい！', 'もういちど 天秤をたしかめてみよう！', '🤔');
            }
        }

        function toggleAnswerHint() {
            showCalculation = !showCalculation;
            const drawer = document.getElementById('calculationDrawer');
            const btnText = document.getElementById('answerBtnText');

            if (showCalculation) {
                drawer.style.display = 'flex';
                btnText.innerText = '計算をかくす';
            } else {
                drawer.style.display = 'none';
                btnText.innerText = '計算を表示';
            }
        }

        function showModal(title, body, iconStr = '✨') {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = body;
            document.getElementById('modalIcon').innerText = iconStr;

            const modal = document.getElementById('messageModal');
            const card = document.getElementById('modalCard');
            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('messageModal');
            const card = document.getElementById('modalCard');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }
    </script>
</body>
</html>
